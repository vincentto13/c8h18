[package]
name = "c8-data"
description = "Data file formats of the game (levels, images, models, fonts, strings, config), shared by the game and the editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
log.workspace = true
png.workspace = true
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
