[package]
name = "c8-edit"
description = "Level and resource editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "c8h18-edit"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "persistence"] }
env_logger = "0.11.11"
bytemuck = "1.25.2"
cpal = "0.18.2"
c8-audio = { path = "../c8-audio" }
c8-data = { path = "../c8-data" }
c8-render = { path = "../c8-render" }
log.workspace = true
png.workspace = true
rfd = "0.18.0"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
base64 = "0.22"
pollster = "1.0.1"
tokio-util = "0.7"
