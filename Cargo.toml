[workspace]
members = ["crates/*"]
# plain `cargo build` / `cargo run` / `cargo test` work on the game, as before the split
default-members = ["crates/c8-game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
log = "0.4.35"
png = "0.18.1"
